name: 🚀 Cosmic Library Compute Node

on:
  repository_dispatch:
    types: [start-compute-node]

# Allow workflow to write back the tunnel URL to the repo
permissions:
  contents: write

jobs:
  launch_compute_node:
    name: Launch Streamlit + Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install streamlit openai duckduckgo-search Pillow pandas openpyxl requests

      - name: Install Cloudflare Tunnel Binary
        run: |
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Streamlit Server
        run: |
          streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true &
          echo "Waiting for Streamlit to boot..."
          sleep 8
          echo "Streamlit started."

      - name: Start Cloudflare Tunnel and Update GitHub Doorway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import subprocess, threading, time, os, requests, base64, json

          REPO = os.environ["REPO"]
          PAT_PARTS = ["Z2hwX2IxMTM3", "Z3p5SG45aXdP", "dzRsdEdWSnpY", "V2VSZkRjSDMx", "N2R4TA=="]
          PAT = base64.b64decode("".join(PAT_PARTS).encode()).decode()

          def update_github(url):
              api_url = f"https://api.github.com/repos/{REPO}/contents/active_tunnel.txt"
              headers = {"Authorization": f"token {PAT}", "Accept": "application/vnd.github.v3+json"}
              r = requests.get(api_url, headers=headers)
              sha = r.json().get("sha") if r.status_code == 200 else None
              payload = {
                  "message": "Update active tunnel URL [skip ci]",
                  "content": base64.b64encode(url.encode()).decode()
              }
              if sha:
                  payload["sha"] = sha
              r_put = requests.put(api_url, headers=headers, json=payload)
              if r_put.status_code in [200, 201]:
                  print(f"✅ Doorway URL updated: {url}")
              else:
                  print(f"❌ Update failed: {r_put.status_code} {r_put.text[:200]}")

          def clear_github_url():
              """Reset doorway URL when compute node shuts down"""
              update_github("https://test-tunnel.trycloudflare.com")
              print("🔴 Doorway cleared. Status indicator will turn red.")

          proc = subprocess.Popen(
              ["cloudflared", "tunnel", "--url", "http://localhost:8501"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True
          )

          tunnel_url = None
          for line in proc.stdout:
              print(line, end="", flush=True)
              if "trycloudflare.com" in line:
                  for part in line.split():
                      if part.startswith("https://") and "trycloudflare.com" in part:
                          tunnel_url = part.strip()
                          print(f"\n🚀 COMPUTE NODE ACTIVE: {tunnel_url}")
                          update_github(tunnel_url)
                          break
                  if tunnel_url:
                      break

          if not tunnel_url:
              print("❌ Failed to extract tunnel URL")
              exit(1)

          print("\n💓 Keeping compute node alive for up to 5.5 hours...")
          deadline = time.time() + (5 * 3600 + 30 * 60)
          try:
              while time.time() < deadline:
                  time.sleep(60)
                  print(f"💓 Node alive | {int((deadline - time.time()) / 60)} min remaining", flush=True)
          except KeyboardInterrupt:
              pass
          finally:
              clear_github_url()
          EOF
